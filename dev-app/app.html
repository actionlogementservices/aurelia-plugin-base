<template>
  <main class="container py-4">
    <h1 class="mb-4">Dev app for aurelia-plugin-fm</h1>

    <form class="row g-3 align-items-end mb-4" submit.trigger="start()">
      <div class="col-md-8">
        <label for="token" class="form-label">Participant token</label>
        <input id="token" class="form-control" value.bind="tokenInput" />
      </div>
      <div class="col-md-2">
        <label for="lang" class="form-label">Language</label>
        <select id="lang" class="form-select" value.bind="options.lang">
          <option value="fr">fr</option>
          <option value="en">en</option>
        </select>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Start</button>
      </div>
    </form>

    <face-matching
      if.bind="token"
      token.bind="token"
      options.bind="options"
      user-event.delegate="log($event)"
      client-file-event.delegate="log($event)"
      error-event.delegate="log($event)"
      exit-event.delegate="log($event)"></face-matching>

    <h2 class="h4 mt-4">Events</h2>
    <pre class="bg-light border rounded p-2 mb-2" repeat.for="event of events">${event}</pre>
  </main>
</template>
